{% if page.url == '/' %}
<!-- ========================================= -->
<!-- ULTRA-PREMIUM WEB SPLASH SCREEN           -->
<!-- ========================================= -->
<style>
  @keyframes premium-reveal {
    0% { transform: scale(0.9) translateY(20px); opacity: 0; filter: blur(12px); }
    100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
  }
  .animate-premium-reveal { animation: premium-reveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  #splash-screen { transition: opacity 0.8s cubic-bezier(0.65, 0, 0.35, 1), transform 0.8s cubic-bezier(0.65, 0, 0.35, 1); }
  .splash-exit { opacity: 0 !important; transform: scale(1.15) !important; pointer-events: none; }
</style>

<div id="splash-screen" class="fixed inset-0 z-9999 flex flex-col items-center justify-center overflow-hidden bg-[#2a1738]/40 backdrop-blur-3xl transition-all duration-800">
  
  <!-- Subtle glowing pulse behind the logo -->
  <div class="absolute w-[80vw] h-[80vw] md:w-[40vw] md:h-[40vw] rounded-full blur-[100px] animate-pulse" style="background-color: rgba(255, 183, 3, 0.4); animation-duration: 4s;"></div>
  
  <!-- The Logo Reveal -->
  <img src="/assets/images/bb-icon-512.png" alt="Beloved Berachah Icon" class="relative z-10 w-1/2 max-w-50 object-contain animate-premium-reveal drop-shadow-[0_10px_30px_rgba(255,183,3,0.5)]">

</div>
{% endif %}

<!-- PWA Install Prompt (Hidden by Default - Home Page Only) -->
<div id="pwa-install-banner" class="hidden fixed top-20 inset-x-4 md:left-auto md:right-4 md:w-96 z-50 transition-all duration-500 transform translate-y-0">
  <div class="p-5 rounded-2xl shadow-2xl border-2 border-white/30 flex justify-between items-center" style="background-color: #B8A280; color: #000000;">
    <div class="flex items-center gap-3">
      <img src="/assets/images/BB.png" alt="Beloved Berachah Icon" class="w-12 h-12 rounded-xl bg-white p-1.5 object-contain shadow-sm shrink-0">
      <div>
        <p class="font-serif font-bold text-base text-black leading-tight">Install Beloved Berachah</p>
        <p class="text-xs text-black/80 font-medium mt-0.5">Add to your device for quick access</p>
      </div>
    </div>
    <div class="flex flex-col gap-2 shrink-0">
      <button id="pwa-install-btn" class="font-bold text-xs py-1.5 px-3 rounded-lg shadow transition hover:opacity-95 cursor-pointer text-center" style="background-color: #FFB703; color: #000000;">Install</button>
      <button id="pwa-close-btn" class="text-xs font-semibold text-black/70 hover:text-black transition text-center cursor-pointer">Later</button>
    </div>
  </div>
</div>

<!-- iOS Install Prompt (Hidden by Default - Home Page Only) -->
<div id="ios-install-banner" class="hidden fixed bottom-6 inset-x-0 z-50 px-4 transition-opacity duration-500">
  <div class="p-4 rounded-2xl shadow-2xl border-2 border-white/30 max-w-sm w-full mx-auto relative pb-5" style="background-color: #B8A280; color: #000000;">
    <div class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-12 border-r-12 border-t-12 border-transparent" style="border-top-color: #B8A280;"></div>
    <button id="ios-close-btn" aria-label="Close install prompt" class="absolute top-3 right-3 text-black/70 hover:text-black transition cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <div class="flex items-start gap-4 pr-6">
      <img src="/assets/images/BB.png" alt="Beloved Berachah Icon" class="w-14 h-14 rounded-xl bg-white p-1.5 object-contain shadow-sm shrink-0">
      <div class="pt-0.5">
        <p class="font-serif font-bold text-lg text-black leading-tight mb-1">Install the App</p>
        <p class="text-xs text-black/80 leading-relaxed font-medium">
          Tap the <strong>Share</strong> button in your browser menu, then select <strong>"Add to Home Screen"</strong>.
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // SPLASH SCREEN DISMISSAL LOGIC
  // ==========================================
  window.addEventListener('load', () => {
    const splashScreen = document.getElementById('splash-screen');
    if (splashScreen) {
      setTimeout(() => {
        splashScreen.classList.add('splash-exit'); // Triggers the CSS fade/zoom out
        setTimeout(() => {
          splashScreen.style.display = 'none'; // Removes it from the DOM flow
        }, 800); // Matches the CSS transition time
      }, 600); // How long the splash screen stays fully visible
    }
  });

  // ==========================================
  // PWA INSTALL LOGIC
  // ==========================================
  let deferredPrompt;
  const installBanner = document.getElementById('pwa-install-banner');
  const iosBanner = document.getElementById('ios-install-banner');
  const iosCloseBtn = document.getElementById('ios-close-btn');

  // Check if current page is the home page
  const isHomePage = window.location.pathname === '/' || window.location.pathname === '/index.html';

  // Android / Desktop PWA Prompt
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); 
    deferredPrompt = e;
    
    if (isHomePage && installBanner) {
      installBanner.classList.remove('hidden'); 
    }
  });

  const installBtn = document.getElementById('pwa-install-btn');
  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (installBanner) installBanner.classList.add('hidden');
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });
  }

  const closeBtn = document.getElementById('pwa-close-btn');
  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      if (installBanner) installBanner.classList.add('hidden');
    });
  }

  // iOS PWA Prompt Logic
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const bannerDismissed = localStorage.getItem('ios_banner_dismissed');

  if (isIOS && !isStandalone && !bannerDismissed && isHomePage) {
    setTimeout(() => {
      if (iosBanner) iosBanner.classList.remove('hidden');
    }, 2000);
  }

  if (iosCloseBtn) {
    iosCloseBtn.addEventListener('click', () => {
      if (iosBanner) iosBanner.classList.add('hidden');
      localStorage.setItem('ios_banner_dismissed', 'true');
    });
  }
</script>
