<!-- ========================================= -->
<!-- GLOBAL SUBPAGE HERO COMPONENT             -->
<!-- ========================================= -->
<header class="relative overflow-hidden border-b-4 border-amber-500 bg-[#4A2B5F] flex items-center justify-center w-full h-95 md:h-110 lg:h-auto lg:aspect-1920/800">
  <!-- Layer 1: Background image. Anchored bottom right so the logo and name stay visible when the top is trimmed. -->
  <img
    src="/assets/images/hero.avif?v=7"
    alt=""
    width="1920"
    height="800"
    fetchpriority="high"
    decoding="async"
    class="absolute inset-0 w-full h-full object-cover"
    style="object-position: right bottom;"
  />

  <!-- Layer 2: Darkening behind the text only, so the corners where the logo sits stay clear. -->
  <div class="absolute inset-0" style="background: radial-gradient(ellipse 55% 65% at 50% 50%, rgba(45, 25, 60, 0.6) 0%, rgba(45, 25, 60, 0.3) 60%, rgba(45, 25, 60, 0) 100%);"></div>

  <!-- Layer 3: Page text content -->
  <div class="container mx-auto px-4 relative z-10 max-w-4xl text-center flex flex-col items-center justify-center">
    <span class="px-4 py-1 text-xs font-bold uppercase tracking-widest rounded-full mb-4 inline-block shadow-md text-black backdrop-blur-sm" style="background-color: rgba(255, 183, 3, 0.9);">
      {{ hero_badge }}
    </span>
    <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-serif text-white mb-4 leading-tight tracking-tight drop-shadow-xl" style="text-shadow: 0 4px 20px rgba(0,0,0,0.65);">
      {{ hero_title }} <span class="font-medium italic" style="color: #FFB703;">{{ hero_highlight }}</span>
    </h1>
    <p class="text-base md:text-xl text-slate-100 leading-relaxed font-normal max-w-2xl mx-auto drop-shadow-lg" style="text-shadow: 0 2px 10px rgba(0,0,0,0.65);">
      {{ hero_subtitle }}
    </p>
  </div>
</header>
