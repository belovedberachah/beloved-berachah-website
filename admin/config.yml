backend:
  name: git-gateway
  branch: main

site_url: https://belovedberachah.netlify.app
display_url: https://belovedberachah.netlify.app

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "news"
    label: "News"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Article Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "thumbnail", widget: "image", required: false}
      - {label: "Image Description (alt text)", name: "thumbnail_alt", widget: "string", required: false, hint: "Describe what the picture shows. Leave blank if there is no image."}
      - {label: "Article Summary", name: "summary", widget: "text"}
      - {label: "Article Body", name: "body", widget: "markdown"}
      - {label: "Tags", name: "tags", widget: "hidden", default: "news"}

  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Event Name", name: "title", widget: "string"}
      - {label: "Event Date", name: "event_date", widget: "datetime"}
      - {label: "Location", name: "location", widget: "string", hint: "Town or area only, for example 'Larne town centre'. Do not add the exact venue unless the trustees have agreed."}
      - {label: "Event Description", name: "body", widget: "markdown"}
      - {label: "Booking Link", name: "booking_link", widget: "string", required: false, hint: "Full address starting with https://", pattern: ['^https://.+', 'Must start with https://']}
      - {label: "Show on website", name: "show_on_site", widget: "boolean", default: true, hint: "Untick to hide this event without deleting it."}
      - {label: "Tags", name: "tags", widget: "hidden", default: "events"}